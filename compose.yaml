services:
  db:
    image: postgres:17-alpine
    container_name: scam-arena-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scam_arena}
      POSTGRES_USER: ${POSTGRES_USER:-scam_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scam_arena_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  scam-arena:
    build: .
    container_name: scam-arena
    depends_on:
      db:
        condition: service_healthy
      rasa:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scam_arena}:${POSTGRES_PASSWORD:-scam_arena_local_dev}@db:5432/${POSTGRES_DB:-scam_arena}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      STT_PROVIDER: ${STT_PROVIDER:-faster_whisper}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_STREAMING_ENABLED: ${DEEPGRAM_STREAMING_ENABLED:-true}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-vi}
      DEEPGRAM_TIMEOUT_SECONDS: ${DEEPGRAM_TIMEOUT_SECONDS:-15}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-3}
      STT_PARTIAL_ENABLED: ${STT_PARTIAL_ENABLED:-true}
      HF_HOME: /models/huggingface
      PIPER_VOICE_PATH: /app/voices/vi_VN-vais1000-medium.onnx
      TTS_CACHE_ENABLED: ${TTS_CACHE_ENABLED:-true}
      TTS_STREAMING_ENABLED: ${TTS_STREAMING_ENABLED:-true}
      TTS_PREWARM_ENABLED: ${TTS_PREWARM_ENABLED:-true}
      PIPER_SENTENCE_PAUSE_MS: ${PIPER_SENTENCE_PAUSE_MS:-350}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      XAPIKEY_BASE_URL: ${XAPIKEY_BASE_URL:-https://api.x-apikey.com/v1}
      XAPIKEY_CALL_API_KEY: ${XAPIKEY_CALL_API_KEY:-}
      XAPIKEY_CALL_MODEL: ${XAPIKEY_CALL_MODEL:-gpt-6.1-sol}
      XAPIKEY_CALL_FALLBACK_MODELS: ${XAPIKEY_CALL_FALLBACK_MODELS:-gpt-6.2-sol,deepseek-v4.1-flash-1017,gpt-6-luna}
      XAPIKEY_MESSAGE_API_KEY: ${XAPIKEY_MESSAGE_API_KEY:-}
      XAPIKEY_MESSAGE_MODEL: ${XAPIKEY_MESSAGE_MODEL:-gpt-6-luna}
      XAPIKEY_MESSAGE_FALLBACK_MODELS: ${XAPIKEY_MESSAGE_FALLBACK_MODELS:-gpt-6.1-sol,gpt-6.2-sol,deepseek-v4.1-flash-1017}
      XAPIKEY_MODEL_TIMEOUT_SECONDS: ${XAPIKEY_MODEL_TIMEOUT_SECONDS:-6}
      XAPIKEY_TIMEOUT_SECONDS: ${XAPIKEY_TIMEOUT_SECONDS:-15}
      CONVERSATION_SUMMARY_ENABLED: ${CONVERSATION_SUMMARY_ENABLED:-true}
      CONVERSATION_SUMMARY_MAX_WORDS: ${CONVERSATION_SUMMARY_MAX_WORDS:-150}
      CONVERSATION_SUMMARY_EVERY_TURNS: ${CONVERSATION_SUMMARY_EVERY_TURNS:-4}
      CONVERSATION_SUMMARY_TIMEOUT_SECONDS: ${CONVERSATION_SUMMARY_TIMEOUT_SECONDS:-6}
      LINE_LLM_ENABLED: ${LINE_LLM_ENABLED:-false}
      DATA_REVIEW_AUTO: ${DATA_REVIEW_AUTO:-true}
      DATA_REVIEW_TIMEOUT_SECONDS: ${DATA_REVIEW_TIMEOUT_SECONDS:-12}
      LINE_LLM_TIMEOUT_SECONDS: ${LINE_LLM_TIMEOUT_SECONDS:-3}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.93}
      LINE_POOL_SIZE: ${LINE_POOL_SIZE:-5}
      LINE_PROMPT_VERSION: ${LINE_PROMPT_VERSION:-v3}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RASA_NLU_URL: http://rasa:5005/model/parse
      RASA_NLU_TIMEOUT_SECONDS: ${RASA_NLU_TIMEOUT_SECONDS:-2}
      RASA_REVIEW_DIR: /dataset
    volumes:
      - whisper-cache:/models/huggingface
      - ./voices:/app/voices
      - ./data:/app/data:ro
      - ./rasa/evaluation/.local/review-workflow:/dataset
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rasa:
    build:
      context: .
      dockerfile: rasa/Dockerfile
    expose:
      - "5005"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/status', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 90s

volumes:
  whisper-cache:
  postgres-data:
