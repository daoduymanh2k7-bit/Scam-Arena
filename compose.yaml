services:
  db:
    image: postgres:17-alpine
    container_name: scam-arena-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scam_arena}
      POSTGRES_USER: ${POSTGRES_USER:-scam_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scam_arena_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  scam-arena:
    build: .
    container_name: scam-arena
    depends_on:
      db:
        condition: service_healthy
      rasa:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scam_arena}:${POSTGRES_PASSWORD:-scam_arena_local_dev}@db:5432/${POSTGRES_DB:-scam_arena}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      STT_PROVIDER: ${STT_PROVIDER:-faster_whisper}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPP_URL: http://whisper-cpp:8080
      WHISPER_CPP_MODEL: ${WHISPER_CPP_MODEL:-base-q8_0}
      WHISPER_CPP_TIMEOUT_SECONDS: ${WHISPER_CPP_TIMEOUT_SECONDS:-45}
      HF_HOME: /models/huggingface
      PIPER_VOICE_PATH: /app/voices/vi_VN-vais1000-medium.onnx
      PIPER_SENTENCE_PAUSE_MS: ${PIPER_SENTENCE_PAUSE_MS:-350}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      XAPIKEY_BASE_URL: ${XAPIKEY_BASE_URL:-https://api.x-apikey.com/v1}
      XAPIKEY_CALL_API_KEY: ${XAPIKEY_CALL_API_KEY:-}
      XAPIKEY_CALL_MODEL: ${XAPIKEY_CALL_MODEL:-minimax-m3.1-flash}
      XAPIKEY_MESSAGE_API_KEY: ${XAPIKEY_MESSAGE_API_KEY:-}
      XAPIKEY_MESSAGE_MODEL: ${XAPIKEY_MESSAGE_MODEL:-gpt-6-luna}
      XAPIKEY_TIMEOUT_SECONDS: ${XAPIKEY_TIMEOUT_SECONDS:-15}
      LINE_LLM_ENABLED: ${LINE_LLM_ENABLED:-false}
      LINE_LLM_TIMEOUT_SECONDS: ${LINE_LLM_TIMEOUT_SECONDS:-3}
      LINE_POOL_SIZE: ${LINE_POOL_SIZE:-5}
      LINE_PROMPT_VERSION: ${LINE_PROMPT_VERSION:-v2}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RASA_NLU_URL: http://rasa:5005/model/parse
      RASA_NLU_TIMEOUT_SECONDS: ${RASA_NLU_TIMEOUT_SECONDS:-2}
      RASA_REVIEW_DIR: /dataset
    volumes:
      - whisper-cache:/models/huggingface
      - ./voices:/app/voices
      - ./data:/app/data:ro
      - ./rasa/evaluation/.local/review-workflow:/dataset
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  whisper-cpp:
    profiles: ["whisper-cpp"]
    build:
      context: .
      dockerfile: deployment/whisper-cpp/Dockerfile
      args:
        WHISPER_CPP_MODEL: ${WHISPER_CPP_MODEL:-base-q8_0}
    command: ["--model", "/models/model.bin", "--host", "0.0.0.0", "--port", "8080", "--language", "vi", "--threads", "2", "--processors", "1", "--beam-size", "3", "--best-of", "1", "--no-fallback", "--no-gpu"]
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rasa:
    build:
      context: .
      dockerfile: rasa/Dockerfile
    expose:
      - "5005"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/status', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 90s

volumes:
  whisper-cache:
  postgres-data:
