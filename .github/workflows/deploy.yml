name: Test and deploy VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'psycopg[binary,pool]>=3.2,<4' httpx pytest python-multipart
      - name: Tests
        env:
          PYTHONPATH: .:backend:rasa/evaluation
        run: python -m pytest backend/tests rasa/evaluation/test_dataset_workflow.py -q
      - name: Check deployment script
        run: bash -n deployment/deploy-vps.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: scam-arena-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User root\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 20\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' "$VPS_HOST" > ~/.ssh/config
      - name: Upload tracked source and deploy
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=source.tar.gz HEAD
          scp source.tar.gz "production:/root/scam-arena-${GITHUB_SHA}.tar.gz"
          # Expand the runner-provided SHA locally, then pass it as a remote argument.
          # shellcheck disable=SC2029
          ssh production "bash -s -- '${GITHUB_SHA}'" < deployment/deploy-vps.sh
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config ~/.ssh/known_hosts
