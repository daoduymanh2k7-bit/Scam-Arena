name: Test and deploy VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      speech_load_test:
        description: 'Run short synthetic 1/4-user ASR tests before and after deployment'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arena_checks
          POSTGRES_USER: arena_checks
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_checks -d arena_checks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'psycopg[binary,pool]>=3.2,<4' 'av>=11,<19' 'websockets>=14,<16' numpy httpx pytest python-multipart
      - name: Tests
        env:
          PYTHONPATH: .:backend:rasa/evaluation
        run: python -m pytest backend/tests rasa/evaluation/test_dataset_workflow.py -q
      - name: Check deployment script
        run: bash -n deployment/deploy-vps.sh deployment/prepare-vps.sh
      - name: Verify scenario migrations and version isolation in PostgreSQL
        env:
          PYTHONPATH: .:backend
          DATABASE_URL: postgresql://arena_checks:ci-local-only@127.0.0.1:5432/arena_checks
        run: |
          python backend/tools/check_scenario_versions.py
          python backend/tools/check_user_management.py
          python backend/tools/check_data_review.py
          python backend/tools/check_compact_schema.py
          python backend/tools/check_consolidated_state.py
      - name: Test call microphone lifecycle
        run: node --test frontend/tests/*.test.cjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: scam-arena-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User root\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 20\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' "$VPS_HOST" > ~/.ssh/config
      - name: Measure current VPS speech service
        if: inputs.speech_load_test || contains(github.event.head_commit.message, '[speech-load-test]')
        run: |
          set -euo pipefail
          mkdir -p speech-load-results
          ssh production 'if test -s /opt/scam-arena/.deployed-revision; then cat /opt/scam-arena/.deployed-revision; else printf "unknown\n"; fi' > speech-load-results/before-revision.txt
          ssh production 'docker inspect scam-arena --format "{{.Image}}"' > speech-load-results/before-image-id.txt
          ssh production 'docker exec -i scam-arena python - --label before --cadence 1.05 --adaptive --audio /tmp/speech-load.wav' < backend/tools/benchmark_speech_load.py > speech-load-results/before.json
          ssh production 'docker cp scam-arena:/tmp/speech-load.wav /root/scam-arena-speech-load.wav'
      - name: Ensure deployment disk space without deleting persistent data
        run: ssh production 'bash -s' < deployment/prepare-vps.sh
      - name: Inspect application startup before deployment
        run: ssh production 'python3 -' < deployment/diagnose-vps.py
      - name: Upload tracked source and deploy
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=source.tar.gz HEAD
          scp source.tar.gz "production:/root/scam-arena-${GITHUB_SHA}.tar.gz"
          # Expand the runner-provided SHA locally, then pass it as a remote argument.
          # shellcheck disable=SC2029
          ssh production "bash -s -- '${GITHUB_SHA}'" < deployment/deploy-vps.sh
          # shellcheck disable=SC2029
          ssh production "grep -Fxq '${GITHUB_SHA}' /opt/scam-arena/.deployed-revision"
      - name: Inspect application startup after deployment
        if: always()
        run: ssh production 'python3 -' < deployment/diagnose-vps.py
      - name: Measure updated VPS speech service
        if: inputs.speech_load_test || contains(github.event.head_commit.message, '[speech-load-test]')
        run: |
          set -euo pipefail
          ssh production 'docker cp /root/scam-arena-speech-load.wav scam-arena:/tmp/speech-load.wav'
          ssh production 'docker exec -i scam-arena python - --label after --cadence 1.05 --adaptive --audio /tmp/speech-load.wav' < backend/tools/benchmark_speech_load.py > speech-load-results/after.json
          ssh production 'rm -f /root/scam-arena-speech-load.wav'
          printf '%s\n' "$GITHUB_SHA" > speech-load-results/after-revision.txt
          ssh production 'docker inspect scam-arena --format "{{.Image}}"' > speech-load-results/after-image-id.txt
      - name: Save speech load measurements
        if: always() && (inputs.speech_load_test || contains(github.event.head_commit.message, '[speech-load-test]'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speech-load-results
          path: speech-load-results/
          retention-days: 14
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config ~/.ssh/known_hosts
